[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "i18n-bugbench"
version = "0.1.0"
description = "Real i18n and portability bug fixes packaged as tasks for AI coding agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Wei-Lun Li"}]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
bugbench = "bugbench.cli:main"

[tool.setuptools]
packages = ["bugbench"]
